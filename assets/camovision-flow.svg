<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="CAMOVISION X: CAMOUFLAGED SOLDIER AND WEAPON DETECTION · DETECTION + SEGMENTATION · ONNX">
<rect width="1200" height="330" rx="16" fill="#0b1626"/><rect x=".5" y=".5" width="1199" height="329" rx="16" fill="none" stroke="#1d3350"/>
<text x="22" y="36" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#e6edf3">CAMOVISION X</text>
<text x="22" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" letter-spacing="1.2" fill="#8b9bb4">CAMOUFLAGED SOLDIER AND WEAPON DETECTION · DETECTION + SEGMENTATION · ONNX</text>
<rect x="22" y="86" width="200" height="130" rx="10" fill="#0e1a2b" stroke="#58a6ff"/><text x="122.0" y="112" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">1  Input frame</text><text x="122.0" y="134" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Image or video frame</text><text x="122.0" y="151" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">of a camouflaged scene</text><text x="122.0" y="200" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#58a6ff">Python + OpenCV</text><line x1="226" y1="151" x2="254" y2="151" stroke="#58a6ff" stroke-width="2"/><path d="M252 146 L260 151 L252 156Z" fill="#58a6ff"/><rect x="264" y="86" width="560" height="130" rx="10" fill="#0f2421" stroke="#1e5a4f"/><text x="544" y="108" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">2  Two models, one frame</text><rect x="280" y="122" width="254" height="50" rx="7" fill="#0e1a2b" stroke="#1e5a4f"/><text x="407" y="143" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#2dd4bf">YOLOv8m detector</text><text x="407" y="160" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#8b9bb4">Soldier + weapon boxes</text><rect x="554" y="122" width="254" height="50" rx="7" fill="#0e1a2b" stroke="#1e5a4f"/><text x="681" y="143" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#2dd4bf">SINet-V2</text><text x="681" y="160" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#8b9bb4">Pixel-level camouflage mask</text><text x="544" y="198" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b9bb4">Boxes say where, the mask says exactly which pixels</text><line x1="828" y1="151" x2="856" y2="151" stroke="#58a6ff" stroke-width="2"/><path d="M854 146 L862 151 L854 156Z" fill="#58a6ff"/><rect x="866" y="86" width="312" height="130" rx="10" fill="#0e1a2b" stroke="#2ea043"/><text x="1022.0" y="112" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">3  Fused result</text><text x="1022.0" y="134" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Confidence fusion of both outputs</text><text x="1022.0" y="151" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Exported to ONNX</text><text x="1022.0" y="200" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#3fb950">Same results at inference time</text><rect x="22" y="232" width="376" height="76" rx="8" fill="#0e1a2b" stroke="#1d3350"/><text x="36" y="254" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#e6edf3">DETECTION</text><text x="36" y="274" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b9bb4">86.3% mAP@0.5 with 91.4% precision</text><text x="36" y="290" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b9bb4">and 80.3% recall on the test set.</text><rect x="412" y="232" width="376" height="76" rx="8" fill="#0e1a2b" stroke="#1d3350"/><text x="426" y="254" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#e6edf3">SEGMENTATION</text><text x="426" y="274" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b9bb4">Fine-tuned SINet-V2 reaches an</text><text x="426" y="290" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b9bb4">MAE of 0.0177 on camouflage masks.</text><rect x="802" y="232" width="376" height="76" rx="8" fill="#0e1a2b" stroke="#1d3350"/><text x="816" y="254" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#e6edf3">TEAM PROJECT</text><text x="816" y="274" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b9bb4">Built with a four-member team as</text><text x="816" y="290" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b9bb4">our IPD project at DJSCE.</text>
</svg>
