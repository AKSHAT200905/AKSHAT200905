 fill="#a78bfa">43 tests</text><text x="616" y="440" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b9bb4">pytest + Vitest</text><line x1="712" y1="427" x2="746" y2="427" stroke="#58a6ff" stroke-width="2"/><path d="M744 422 L752 427 L744 432Z" fill="#58a6ff"/><rect x="756" y="384" width="190" height="86" rx="10" fill="#0e1a2b" stroke="#2ea043"/><text x="851.0" y="410" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">GitHub Actions</text><text x="851.0" y="432" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Tests on real Postgres</text><text x="851.0" y="449" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">plus an end-to-end smoke test</text><text x="851.0" y="454" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#58a6ff"></text><line x1="950" y1="427" x2="976" y2="427" stroke="#58a6ff" stroke-width="2"/><path d="M974 422 L982 427 L974 432Z" fill="#58a6ff"/><rect x="986" y="384" width="178" height="86" rx="10" fill="#0e1a2b" stroke="#1d3350"/><text x="1075.0" y="410" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">Docker images</text><text x="1075.0" y="432" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Published to GHCR</text><text x="1075.0" y="449" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">One command to run</text><text x="1075.0" y="454" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#58a6ff"></text><text x="22" y="526" font-fam