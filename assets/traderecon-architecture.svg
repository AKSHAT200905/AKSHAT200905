a6ff">React 19 + Vite</text><line x1="396" y1="188" x2="411" y2="188" stroke="#58a6ff" stroke-width="2"/><path d="M409 183 L417 188 L409 193Z" fill="#58a6ff"/><rect x="420" y="128" width="165" height="120" rx="10" fill="#0e1a2b" stroke="#1d3350"/><text x="502.5" y="154" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">trade-service</text><text x="502.5" y="176" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Validates every row</text><text x="502.5" y="193" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Rejects with reasons</text><text x="502.5" y="232" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#58a6ff">FastAPI</text><line x1="588" y1="188" x2="603" y2="188" stroke="#58a6ff" stroke-width="2"/><path d="M601 183 L609 188 L601 193Z" fill="#58a6ff"/><rect x="612" y="128" width="165" height="120" rx="10" fill="#0e1a2b" stroke="#1d3350"/><text x="694.5" y="154" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">recon-service</text><text x="694.5" y="176" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Asks trade-service</text><text x="694.5" y="193" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">for one trade date</text><text x="694.5" y="232" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#58a6ff">REST, not shared DB</text><line x1="780" y1="188" x2="795" y2="188" stroke="#58a6ff" stroke-width="2"/><path d="M793 183 L801 188 L793 193Z" fill="#58a6ff"/><rect x="804" y="128" width="165" height="120" rx="10" fill="#0e1a2b" stroke="#1d3350"/><text x="886.5" y="154" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">Matching engine</text><text x="886.5" y="176" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Field by field</text><text x="886.5" y="193" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Price tolerance in bp</text><text x="886.5" y="232" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#58a6ff">9 break types</text><line x1="972" y1="188" x2="987" y2="188" stroke="#58a6ff" stroke-width="2"/><path d="M985 183 L993 188 L985 193Z" fill="#58a6ff"/><rect x="996" y="128" width="165" height="120" rx="10" fill="#0e1a2b" stroke="#2ea043"/><text x="1078.5" y="154" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">Break workflow</text><text x="1078.5" y="176" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Resolve with comment</text><text x="1078.5" y="193" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b9bb4">Reopen · export CSV</text><text x="1078.5" y="232" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#3fb950">Full audit trail</text><rect x="250" y="290" width="700" height="46" rx="8" fill="#0e1a2b" stroke="#1d3350"/><text x="600" y="309" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e6edf3">DATABASE PER SERVICE</text><text x="600" y="326" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font